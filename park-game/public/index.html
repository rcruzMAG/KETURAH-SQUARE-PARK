<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1a16">
<title>Keturah Square Park — First-Person Experience</title>
<style>
  :root {
    --terracotta: #b65f3e;
    --amber: #ffb43c;
    --cream: #f4f1ea;
    --ink: #15120e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
  body { font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--cream); }
  canvas#c { display: block; width: 100%; height: 100%; touch-action: none; }

  /* intro */
  #intro {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background:
      radial-gradient(120% 90% at 50% 110%, rgba(182,95,62,.38), transparent 60%),
      radial-gradient(90% 60% at 50% -10%, rgba(70,90,120,.5), transparent 65%),
      var(--ink);
    transition: opacity .8s ease, visibility .8s;
    padding: 24px;
  }
  #intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #concept { letter-spacing: .42em; font-size: 12px; color: var(--amber); text-transform: uppercase; margin: 0; }
  #title { font-size: clamp(30px, 6vw, 64px); letter-spacing: .14em; margin: 0; font-weight: 700; }
  #subtitle { margin: 0; opacity: .82; font-size: clamp(13px, 2.2vw, 17px); max-width: 560px; line-height: 1.5; }
  #controls {
    margin-top: 14px; display: grid; gap: 6px; font-size: 13px; opacity: .78;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    padding: 14px 22px; border-radius: 12px; max-width: 480px;
  }
  #ctrlHead { font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: var(--amber); }
  #enter {
    margin-top: 18px; cursor: pointer; border: 0; border-radius: 999px;
    padding: 15px 44px; font-size: 16px; font-weight: 600; letter-spacing: .06em;
    color: var(--ink); background: linear-gradient(135deg, #ffd089, var(--amber));
    box-shadow: 0 8px 30px rgba(255,180,60,.35);
    transition: transform .15s ease;
  }
  #enter:hover { transform: translateY(-2px) scale(1.02); }

  /* HUD */
  .hud { position: fixed; z-index: 10; user-select: none; -webkit-user-select: none; }
  #dot { left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%;
         background: rgba(255,255,255,.85); box-shadow: 0 0 5px rgba(0,0,0,.6); }
  #map { left: 16px; bottom: 16px; width: 160px; height: 160px; border-radius: 12px;
         box-shadow: 0 4px 22px rgba(0,0,0,.45); opacity: .94; }
  #zoneCount { left: 16px; bottom: 184px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
               background: rgba(21,18,14,.62); padding: 5px 10px; border-radius: 8px; }
  #topBtns { right: 14px; top: 14px; display: flex; gap: 8px; }
  #topBtns button {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(21,18,14,.55); color: var(--cream); font-size: 19px; cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #prompt {
    left: 50%; bottom: 13%; transform: translateX(-50%) translateY(14px);
    background: rgba(21,18,14,.78); border: 1px solid rgba(255,180,60,.55);
    padding: 11px 20px; border-radius: 999px; font-size: 14px; letter-spacing: .04em;
    opacity: 0; transition: all .25s ease; cursor: pointer; white-space: nowrap; max-width: 92vw;
  }
  #prompt.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #prompt .key {
    display: inline-block; background: var(--amber); color: var(--ink); font-weight: 700;
    border-radius: 6px; padding: 1px 8px; margin-right: 9px; font-size: 13px;
  }
  #btnAct {
    right: 22px; bottom: 21%; width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(255,180,60,.8); background: rgba(255,180,60,.25); color: var(--cream);
    font-size: 22px; font-weight: 700; display: none; cursor: pointer;
  }
  #btnAct.show { display: block; }

  /* discovery card */
  #card {
    right: 18px; bottom: 18px; width: min(340px, calc(100vw - 200px));
    background: linear-gradient(160deg, rgba(32,27,21,.94), rgba(21,18,14,.94));
    border: 1px solid rgba(255,180,60,.35); border-radius: 16px; padding: 18px 20px;
    transform: translateY(18px); opacity: 0; pointer-events: none; transition: all .35s ease;
    box-shadow: 0 14px 44px rgba(0,0,0,.5);
  }
  #card.show { opacity: 1; transform: none; }
  #cardKicker { font-size: 10px; letter-spacing: .32em; color: var(--amber); text-transform: uppercase; }
  #cardTitle { font-size: 20px; font-weight: 700; margin: 6px 0 8px; }
  #cardBody { font-size: 13px; line-height: 1.55; opacity: .85; }
  #cardTag { margin-top: 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); opacity: .9; }

  /* completion */
  #done {
    left: 50%; top: 16%; transform: translate(-50%, -8px); width: min(520px, 92vw); text-align: center;
    background: linear-gradient(160deg, rgba(32,27,21,.95), rgba(21,18,14,.95));
    border: 1px solid rgba(255,180,60,.5); border-radius: 18px; padding: 26px 30px;
    opacity: 0; pointer-events: none; transition: all .5s ease;
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
  }
  #done.show { opacity: 1; transform: translate(-50%, 0); }
  #doneTitle { font-size: 22px; font-weight: 700; color: var(--amber); margin-bottom: 10px; }
  #doneBody { font-size: 14px; line-height: 1.6; opacity: .88; }

  /* touch stick */
  #stick { display: none; position: fixed; z-index: 9; width: 104px; height: 104px; border-radius: 50%;
           border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.07); pointer-events: none; }
  #knob { position: absolute; left: 32px; top: 32px; width: 40px; height: 40px; border-radius: 50%;
          background: rgba(255,255,255,.5); }

  #dev { display: none; position: fixed; z-index: 40; top: 6px; left: 6px; color: #6f6;
         font: 12px/1.4 ui-monospace, monospace; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro">
  <p id="concept"></p>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
  <div id="controls">
    <span id="ctrlHead"></span>
    <span id="ctrl1"></span><span id="ctrl2"></span><span id="ctrl3"></span><span id="ctrl4"></span><span id="ctrl5"></span>
  </div>
  <button id="enter"></button>
</div>

<div class="hud" id="dot"></div>
<canvas class="hud" id="map" width="160" height="160"></canvas>
<div class="hud" id="zoneCount"></div>
<div class="hud" id="topBtns">
  <button id="btnTime">🌙</button>
  <button id="btnMute">🔊</button>
</div>
<div class="hud" id="prompt"><span class="key">E</span><span id="promptText"></span></div>
<button class="hud" id="btnAct">✦</button>
<div class="hud" id="card">
  <div id="cardKicker"></div>
  <div id="cardTitle"></div>
  <div id="cardBody"></div>
  <div id="cardTag"></div>
</div>
<div class="hud" id="done">
  <div id="doneTitle"></div>
  <div id="doneBody"></div>
</div>
<div id="stick"><div id="knob"></div></div>
<div id="dev"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
